<!DOCTYPE html>
<!--
  CogCards game-interface mockup (saved from cogcards-case-study.html, Oct 2026).
  To re-insert: copy the CSS between the GAME MOCKUP markers into the case study's <style> block,
  and the <figure class="game-figure"> block into the page (it was last in the Approach section,
  right after the closing </div> of .method-row). The :root colors below already exist in the case study.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CogCards — Game Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --felt:#173228; --felt-dark:#0F211B; --cream:#F4EDE0; --paper:#FBF8F2; --crimson:#9C2B3A; --gold:#C8A24A; }
  body{ margin:0; background:var(--cream); font-family:'Inter',sans-serif; }
  .wrap{ max-width:760px; margin:0 auto; padding:20px 28px 40px; }
  figure{ margin:0; }
  .reveal{ opacity:1; }
  /* GAME MOCKUP */
  .game-figure{ margin:44px 0 0; }
  .game-mock{
    position:relative;
    background:radial-gradient(120% 120% at 50% 0%, #1F4A38 0%, var(--felt) 55%, var(--felt-dark) 100%);
    border-radius:18px;
    padding:clamp(14px,3.5vw,28px);
    box-shadow:0 18px 40px rgba(15,33,27,.28), inset 0 0 0 1px rgba(200,162,74,.35);
    font-family:'Inter',sans-serif;
    color:var(--cream);
    user-select:none;
  }
  .game-mock::before{
    content:""; position:absolute; inset:8px; border-radius:12px;
    border:1px dashed rgba(200,162,74,.25); pointer-events:none;
  }
  .gm-top{ display:flex; justify-content:space-between; gap:12px; }
  .gm-panel{
    background:var(--felt-dark);
    border:1px solid rgba(200,162,74,.55);
    border-radius:10px;
    padding:clamp(8px,1.6vw,12px) clamp(14px,3vw,26px);
    text-align:center;
    min-width:34%;
    box-shadow:0 6px 14px rgba(0,0,0,.25);
  }
  .gm-label{ font-size:clamp(.56rem,1.3vw,.7rem); letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:600; }
  .gm-val{ font-family:'Fraunces',serif; font-weight:600; font-size:clamp(1.15rem,3.4vw,1.75rem); line-height:1.15; margin-top:2px; }
  .gm-cards{ display:flex; justify-content:center; gap:4%; margin:clamp(20px,4.5vw,36px) 0 clamp(18px,4vw,30px); }
  .gm-card{
    width:17%; aspect-ratio:5/7;
    background:var(--cream);
    border-radius:clamp(5px,1vw,9px);
    padding:clamp(3px,.7vw,6px);
    box-shadow:0 2px 0 #E4DACA, 0 4px 0 #D6CBB8, 0 6px 0 #C9BEAA, 0 14px 22px rgba(0,0,0,.4);
  }
  .gm-back{
    position:relative; height:100%;
    border-radius:clamp(3px,.6vw,6px);
    background-color:var(--crimson);
    background-image:
      repeating-linear-gradient(45deg, rgba(244,237,224,.16) 0 1.5px, transparent 1.5px 8px),
      repeating-linear-gradient(-45deg, rgba(244,237,224,.16) 0 1.5px, transparent 1.5px 8px);
    box-shadow:inset 0 0 0 clamp(2px,.4vw,4px) var(--crimson), inset 0 0 0 clamp(3px,.55vw,5px) rgba(200,162,74,.8);
    display:grid; place-items:center;
  }
  .gm-emb{
    width:52%; aspect-ratio:1; border-radius:50%;
    background:var(--crimson);
    border:clamp(1px,.25vw,2px) solid rgba(200,162,74,.9);
    box-shadow:0 0 0 clamp(2px,.5vw,4px) var(--crimson), 0 0 0 clamp(3px,.65vw,5px) rgba(244,237,224,.5);
    display:grid; place-items:center;
    color:var(--gold); font-size:clamp(.9rem,2.6vw,1.5rem); line-height:1;
  }
  .gm-bets{ display:flex; justify-content:center; gap:clamp(6px,1.6vw,14px); }
  .gm-btn{
    background:var(--felt-dark);
    border:1px solid rgba(200,162,74,.55);
    border-radius:8px;
    color:var(--cream);
    font-weight:600;
    font-size:clamp(.78rem,1.9vw,1rem);
    padding:clamp(6px,1.2vw,9px) 0;
    width:clamp(44px,11vw,76px);
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,.25);
  }
  .gm-bottom{ position:relative; display:flex; justify-content:center; margin-top:clamp(14px,3vw,22px); }
  .gm-howto{ width:auto; padding-left:clamp(22px,6vw,56px); padding-right:clamp(22px,6vw,56px); letter-spacing:.1em; font-size:clamp(.66rem,1.6vw,.82rem); text-transform:uppercase; }
  .gm-info{
    position:absolute; left:0; bottom:0; width:clamp(28px,5vw,38px);
    font-family:'Fraunces',serif; font-style:italic; padding:clamp(4px,.9vw,7px) 0;
  }
  .gm-note{ font-size:.82rem; color:#8a8880; text-align:center; margin:14px 0 0; }
  /* END GAME MOCKUP */
</style>
</head>
<body>
<div class="wrap">
    <figure class="game-figure reveal" aria-label="Mockup of the CogCards game interface">
      <div class="game-mock" role="img" aria-label="Game screen showing winnings of $1,250, 8 turns remaining, four face-down card decks, bet multiplier buttons from 1x to 5x, and a How to Play button.">
        <div class="gm-top">
          <div class="gm-panel"><div class="gm-label">Winnings</div><div class="gm-val">$1,250.00</div></div>
          <div class="gm-panel"><div class="gm-label">Turns remaining</div><div class="gm-val">8</div></div>
        </div>
        <div class="gm-cards">
          <div class="gm-card"><div class="gm-back"><span class="gm-emb">♠</span></div></div>
          <div class="gm-card"><div class="gm-back"><span class="gm-emb">♥</span></div></div>
          <div class="gm-card"><div class="gm-back"><span class="gm-emb">♦</span></div></div>
          <div class="gm-card"><div class="gm-back"><span class="gm-emb">♣</span></div></div>
        </div>
        <div class="gm-bets">
          <div class="gm-btn">1x</div><div class="gm-btn">2x</div><div class="gm-btn">3x</div><div class="gm-btn">4x</div><div class="gm-btn">5x</div>
        </div>
        <div class="gm-bottom">
          <div class="gm-btn gm-info">i</div>
          <div class="gm-btn gm-howto">How to play</div>
        </div>
      </div>
      <figcaption class="gm-note">* Mockup of the game interface; not the original production design.</figcaption>
    </figure>
</div>
</body>
</html>
